    <!-- Mesma cor de fundo do app desde o primeiro quadro: no app instalado, a

    <style>html,body{background:#FAFAF9}.bl-wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#FAFAF9;z-index:2000;opacity:0;animation:bl-in .2s ease-out .15s forwards}

.bl-anim{position:relative;width:92px;height:92px}
.bl-grid{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(225deg)}
.bl-box{position:absolute;left:-7.3px;top:-7.3px;width:14.6px;height:14.6px;box-sizing:border-box;border:1.6px solid #1C1917;border-radius:3px;background:#fff;will-change:transform;animation:1.617s linear var(--bl-d,0s) infinite}
.bl-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#A8A29E;letter-spacing:.02em}

.bl-b0{animation-name:bl-k0}.bl-b1{animation-name:bl-k1}.bl-b2{animation-name:bl-k2}.bl-b3{animation-name:bl-k3}.bl-b4{animation-name:bl-k4}.bl-b5{animation-name:bl-k5}.bl-b6{animation-name:bl-k6}

@keyframes bl-k2{0%{transform:translate(22px,-22px)}7.2%{transform:translate(22px,-21.9px)}12.4%{transform:translate(22px,-21.4px)}17.5%{transform:translate(22px,-20.4px)}21.6%{transform:translate(22px,-19px)}24.7%{transform:translate(22px,-17.1px)}26.8%{transform:translate(22px,-15.3px)}28.9%{transform:translate(22px,-12.8px)}32%{transform:translate(22px,-8.5px)}33%{transform:translate(22px,-7.4px)}35.1%{transform:translate(22px,-5.5px)}37.1%{transform:translate(22px,-4.2px)}39.2%{transform:translate(22px,-3.2px)}44.3%{transform:translate(22px,-1.6px)}50.5%{transform:translate(22px,-0.6px)}58.8%{transform:translate(22px,0px)}91.8%{transform:translate(22px,0px)}100%{transform:translate(21.4px,0px)}}

@keyframes bl-k6{0%{transform:translate(-22.1px,22px)}52.6%{transform:translate(-22.1px,22px)}59.8%{transform:translate(-22.1px,21.5px)}64.9%{transform:translate(-22.1px,20.7px)}70.1%{transform:translate(-22.1px,19px)}72.2%{transform:translate(-22.1px,17.9px)}74.2%{transform:translate(-22.1px,16.4px)}76.3%{transform:translate(-22.1px,14.3px)}80.4%{transform:translate(-22.1px,8.7px)}81.4%{transform:translate(-22.1px,7.5px)}83.5%{transform:translate(-22.1px,5.6px)}85.6%{transform:translate(-22.1px,4.3px)}88.7%{transform:translate(-22.1px,2.8px)}92.8%{transform:translate(-22.1px,1.5px)}96.9%{transform:translate(-22.1px,0.4px)}100%{transform:translate(-22.1px,0px)}}
@media (prefers-reduced-motion:reduce){.bl-box{animation-play-state:paused}}</style>

  <body class="notranslate">
    <div id="root">
      <!-- Tela de carregamento até o app abrir (o React troca pelo conteúdo). -->
      <div class="bl-wrap" id="bl-splash" role="status"><div class="bl-anim" aria-hidden="true"><div class="bl-grid"><i class="bl-box bl-b0"></i><i class="bl-box bl-b1"></i><i class="bl-box bl-b2"></i><i class="bl-box bl-b3"></i><i class="bl-box bl-b4"></i><i class="bl-box bl-b5"></i><i class="bl-box bl-b6"></i></div></div><div class="bl-text">Carregando…</div></div>
      <script>document.getElementById("bl-splash").style.setProperty("--bl-d","-"+Math.round(performance.now()%1617)+"ms")</script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
