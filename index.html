.gs-g{stroke-dasharray:1;stroke-dashoffset:1;animation:gs-draw .6s cubic-bezier(.6,0,.3,1) .1s forwards}
.gs-l{opacity:0;transform:translateX(-18px);animation:gs-fly .35s ease-out .45s forwards}
.gs-p{opacity:0;transform:translateY(-26px);transform-box:fill-box;animation:gs-drop .45s cubic-bezier(.3,1.6,.5,1) .6s forwards}
.gs-w{opacity:0;transform:translateX(-14px);animation:gs-fly .4s ease-out .8s forwards}
.gs-tag{font:700 clamp(7px,2.1vw,9.5px) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.14em;color:#52606D;white-space:nowrap;opacity:0;animation:gs-fade .4s ease-out 1.05s forwards}
@keyframes gs-draw{to{stroke-dashoffset:0}}
@keyframes gs-fly{to{opacity:1;transform:none}}
